{id:'c1',title:'C 1: Memory and pointers',sub:'The mental model everything else in C rests on.',acc:'#0E6B8F',
intro:`<p>In C# or Python a runtime protects you: it frees memory, checks array bounds and gives you a real string type. C has none of that. A program is bytes in memory, and a <b>pointer is a variable that holds an address</b>.</p>
<p>Data lives in one of three places: the <b>stack</b> (locals, released automatically when the function returns), the <b>heap</b> (memory you request with <code>malloc</code> and must <code>free</code>), and <b>static</b> storage (globals, alive for the whole run).</p>
<ul><li><code>&amp;x</code> is the address of <code>x</code>; <code>*p</code> is the thing <code>p</code> points to.</li>
<li><code>p + 1</code> moves one <i>element</i>, not one byte.</li>
<li><code>arr[i]</code> is defined as <code>*(arr + i)</code>.</li>
<li>C passes everything by value. To change the caller’s data, pass its address.</li>
<li>An array name decays to a pointer to its first element, so <code>sizeof</code> differs inside a function.</li>
<li>Nothing checks bounds. Reading <code>arr[10]</code> compiles, and the result is undefined behavior.</li></ul>`,
code:`#include <stdio.h>

void swap(int *a, int *b) { int t = *a; *a = *b; *b = t; }

int main(void) {
    int x = 10;
    int *p = &x;
    *p = 20;
    printf("x=%d *p=%d\\n", x, *p);

    int arr[3] = {1, 2, 3};
    int *q = arr + 1;
    *q = 9;
    printf("%d %d\\n", arr[1], *(arr + 1));
    printf("%zu %zu\\n", sizeof arr, sizeof q);

    int a = 1, b = 2;
    swap(&a, &b);
    printf("a=%d b=%d\\n", a, b);
    return 0;
}`,

{id:'p1',title:'Python 1: Names, objects and mutability',sub:'The same idea as C pointers, seen from the other side.',acc:'#8A5A00',
intro:`<p>In Python a variable is a <b>name bound to an object</b>, much like a pointer you never have to dereference. Assignment copies the reference, not the object. That one fact explains most surprises.</p>
<ul><li><b>Mutable</b> objects (list, dict, set) change in place. <b>Immutable</b> ones (int, str, tuple) never do; “changing” them rebinds the name.</li>
<li><code>==</code> asks whether two objects have equal values. <code>is</code> asks whether they are the same object.</li>
<li><code>b = a</code> makes an alias. <code>a.copy()</code> or <code>a[:]</code> makes a <i>shallow</i> copy: new outer container, same inner objects. <code>copy.deepcopy</code> copies recursively.</li>
<li>Default argument values are evaluated <b>once</b>, when the function is defined.</li></ul>
<p>Compare with C 1: <code>b = a</code> is like <code>int *b = a</code> (two names, one object), while a C <code>int</code> assignment copies the value.</p>`,
code:`a = [1, 2, 3]
b = a              # alias: same object
b.append(4)
print(a)           # [1, 2, 3, 4]
print(a is b)      # True

c = a.copy()       # shallow copy
c.append(5)
print(a == c, a is c)   # False False

print([1] == [1], [1] is [1])   # True False
print(id(a), id(b), id(c))      # a and b match`,
quiz:[
{q:'a = [1]; b = a; b += [2]. What is a?',o:['[1]','[1, 2]','[2]','An error'],a:1,w:'For lists, += extends in place, and a and b are the same object. With an immutable type such as a tuple, += would rebind b instead.'},
{q:'Which statement is guaranteed to be true?',o:['[1] is [1]','[1] == [1] and [1] is not [1]','x = 5; y = 5 always means x is y','"a" is "a" in every Python'],a:1,w:'Two separate list displays create two objects. Identity of small ints and strings is a CPython optimization you should never rely on.'},
{q:'When is the default value in def f(x, acc=[]) created?',o:['On every call','Once, when the def statement runs','Only when acc is omitted, each time','At import time of the caller'],a:1,w:'The list is created once and stored on the function object, so every call without acc shares it.'}],

{id:'c2',title:'C 2: Arrays and strings',sub:'Where most real-world C bugs are born.',acc:'#0E6B8F',
intro:`<p>An array is a fixed run of consecutive elements with no length stored anywhere. A C string is just a <code>char</code> array whose last byte is <code>'\\0'</code>, and every <code>&lt;string.h&gt;</code> function trusts that byte to find the end.</p>
<ul><li><code>char a[] = "hi"</code> is a 3-byte array you own and may modify. <code>const char *b = "hi"</code> points at a read-only literal; writing through it is undefined behavior.</li>
<li><code>sizeof</code> counts bytes of the array (including the terminator); <code>strlen</code> counts characters before it.</li>
<li><code>strcpy</code> and <code>strcat</code> never check the destination size. Prefer <code>snprintf</code> or <code>memcpy</code> with a length you checked yourself.</li>
<li>Always pass an array together with its length.</li></ul>`,
code:`#include <stdio.h>
#include <string.h>

int main(void) {
    char a[] = "hi";                 /* 3 bytes: 'h' 'i' 0 */
    const char *b = "hi";            /* pointer to a read-only literal */
    printf("%zu %zu %zu\\n", sizeof a, strlen(a), sizeof b);
    a[0] = 'H';                      /* fine: we own this array */
    /* b[0] = 'H'; */                /* undefined behavior */

    char buf[8];
    snprintf(buf, sizeof buf, "%s-%d", "abc", 42);   /* truncates safely */
    printf("%s\\n", buf);
    return 0;
}`,

{id:'p2',title:'Python 2: Iterators and generators',sub:'Lazy sequences, and why a generator can only be used once.',acc:'#8A5A00',
intro:`<p>A <b>for</b> loop calls <code>iter()</code> on an iterable to get an iterator, then calls <code>next()</code> until <code>StopIteration</code>. A function containing <code>yield</code> is a <b>generator function</b>: calling it runs nothing yet, it returns a generator object that produces values on demand.</p>
<ul><li>Generators are lazy and single-pass. Once exhausted they stay empty.</li>
<li><code>[x for ...]</code> builds the whole list now; <code>(x for ...)</code> builds nothing until consumed.</li>
<li>Lazy pipelines handle huge or endless streams (log files, camera frames) in constant memory.</li>
<li><code>itertools.islice</code> takes a slice of any iterator.</li></ul>`,
code:`def countdown(n):
    while n > 0:
        yield n
        n -= 1

g = countdown(3)
print(next(g), next(g))     # 3 2
print(list(g))              # [1]
print(list(g))              # []  exhausted

squares = [x * x for x in range(5)]   # list: built now
lazy = (x * x for x in range(5))      # generator: built on demand
print(sum(lazy), sum(lazy))           # 30 0`,

{q:'What does calling a function that contains yield return?',o:['Its first yielded value','A generator object; the body has not started','None','A list of all values'],a:1,w:'The body only runs when you call next() or iterate. That laziness is the point.'},

{id:'c3',title:'C 3: malloc, free and ownership',sub:'The heap, and the rule that someone must always own each block.',acc:'#0E6B8F',
intro:`<p><code>malloc(n)</code> returns <code>n</code> bytes of heap memory or <code>NULL</code>. Nothing frees it for you. The discipline that keeps C programs correct is <b>ownership</b>: for every block, exactly one piece of code is responsible for calling <code>free</code> exactly once.</p>
<ul><li>Size with <code>sizeof *p</code>, not a hard-coded type: <code>malloc(n * sizeof *p)</code>.</li>
<li><code>calloc</code> zeroes the memory; <code>malloc</code> leaves garbage.</li>
<li><code>free(NULL)</code> is safe. Freeing twice, or using memory after free, is undefined behavior.</li>
<li><code>p = realloc(p, n)</code> leaks if it fails. Assign to a temporary first.</li>
<li>Document ownership in the API: who allocates, who frees.</li></ul>
<p>Run everything with <code>-fsanitize=address</code>; it reports leaks, overflows and use-after-free with a stack trace.</p>`,
code:`#include <stdio.h>
#include <stdlib.h>

int *make_squares(size_t n) {
    int *a = malloc(n * sizeof *a);
    if (!a) return NULL;
    for (size_t i = 0; i < n; i++) a[i] = (int)(i * i);

s:`typedef struct { int *data; size_t len, cap; } vec;

int vec_push(vec *v, int x) {
    if (v->len == v->cap) {
        size_t ncap = v->cap ? v->cap * 2 : 4;
        int *tmp = realloc(v->data, ncap * sizeof *tmp);
        if (!tmp) return -1;         /* old block is still valid */
        v->data = tmp;
        v->cap = ncap;
    }
    v->data[v->len++] = x;
    return 0;
}

    free(v->data);
    v->data = NULL;

{id:'p3',title:'Python 3: Closures, decorators, context managers',sub:'Python’s version of guaranteed cleanup and wrapping behavior.',acc:'#8A5A00',
intro:`<p>Functions are objects, so you can pass them around and return them. A <b>closure</b> is an inner function that remembers variables from its enclosing scope. A <b>decorator</b> is a function that takes a function and returns a replacement: <code>@timed</code> above <code>def f</code> means <code>f = timed(f)</code>.</p>
<ul><li>Always use <code>functools.wraps</code> so the wrapper keeps the original name and docstring.</li>
<li>Closures capture <i>variables</i>, not values, so they see the latest value when called (late binding).</li>
<li>A <b>context manager</b> guarantees cleanup: <code>with</code> calls <code>__exit__</code> even if the body raises. It is Python’s answer to the C rule that every allocation has a matching free.</li>
<li>Write one with <code>__enter__</code>/<code>__exit__</code>, or with <code>@contextlib.contextmanager</code> and a <code>try/finally</code> around <code>yield</code>.</li></ul>`,
code:`import functools, time
from contextlib import contextmanager

def timed(fn):
    @functools.wraps(fn)
    def wrapper(*args, **kwargs):
        t0 = time.perf_counter()
        try:
            return fn(*args, **kwargs)
        finally:
            print(f"{fn.__name__}: {time.perf_counter() - t0:.4f}s")
    return wrapper

@timed
def work(n):
    return sum(range(n))

@contextmanager
def opened(name):
    print("open", name)
    try:
        yield name
    finally:
        print("close", name)     # always runs

with opened("cam0") as c:
    work(10**6)`,

{q:'Why use functools.wraps inside a decorator?',o:['It makes the wrapper faster','It preserves the wrapped function’s __name__ and docstring','It catches exceptions','It is required for the code to run'],a:1,w:'Without it every decorated function reports its name as "wrapper", which breaks logs, debuggers and test reports.'},

{t:'Write the retry(times, exceptions) decorator',d:'Call the wrapped function up to times times. If it raises one of the given exceptions, try again; if the last attempt also fails, re-raise. Any other exception propagates immediately. Keep the function’s name.',h:'You need three nested functions: retry(...) returns deco(fn), which returns wrapper(*a, **kw). Re-raise with a bare raise on the last attempt.',
s:`import functools

def retry(times, exceptions=(Exception,)):
    def deco(fn):
        @functools.wraps(fn)
        def wrapper(*a, **kw):
            for attempt in range(times):
                try:
                    return fn(*a, **kw)
                except exceptions:
                    if attempt == times - 1:
                        raise
        return wrapper
    return deco`,w:'A decorator that takes arguments is a decorator factory, which is why there are three levels.',
test:`# paste retry above
calls = {"n": 0}

@retry(times=3, exceptions=(ValueError,))
def flaky():
    calls["n"] += 1
    if calls["n"] < 3:
        raise ValueError
    return "done"

assert flaky() == "done" and calls["n"] == 3
assert flaky.__name__ == "flaky"

@retry(times=2, exceptions=(ValueError,))
def bad():
    raise ValueError

raised = False
try:
    bad()
except ValueError:
    raised = True
assert raised
print("ok")`},
{t:'Write a Resource context manager class',d:'Resource(log) appends "open" to the list on entry and "close" on exit, and must not swallow exceptions.',h:'Implement __enter__ and __exit__(self, exc_type, exc, tb). Return False from __exit__.',
s:`class Resource:
    def __init__(self, log):
        self.log = log

    def __enter__(self):
        self.log.append("open")
        return self

    def __exit__(self, exc_type, exc, tb):
        self.log.append("close")
        return False      # do not swallow exceptions`,w:'Same shape as open/close or malloc/free in C, but the language enforces the pairing.',

        raise KeyError
